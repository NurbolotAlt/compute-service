# ============================================================
# nginx.conf для compute-service
# Роли: раздача статики, reverse proxy к backend, WebSocket,
# TLS termination, балансировка нагрузки, rate limiting,
# upstream-логирование
# ============================================================

# --- Балансировка между backend-репликами ---
# least_conn вместо round-robin (по умолчанию): отправляет запрос
# на backend с МЕНЬШИМ числом активных соединений, а не просто по кругу.
# Важно именно для этого проекта — запросы сильно разные по длительности
# (fibonacci(10) мгновенно, fibonacci(36) может занять секунды),
# round-robin мог бы закинуть новый запрос на уже занятый backend,
# пока соседний простаивает.
upstream backend {
    least_conn;
    # zone — состояние балансировки (число активных соединений к каждой реплике)
    # в ОБЩЕЙ памяти всех worker-процессов nginx. Без неё у каждого worker'а свой
    # счётчик: least_conn видит только свои соединения, а серия новых соединений,
    # попадая в разные "свежие" worker'ы, уходит на одну и ту же первую реплику.
    zone backend_upstream 64k;
    # max_fails/fail_timeout — пассивная проверка здоровья. По умолчанию
    # max_fails=1: ОДНА ошибка соединения, и реплика 10 с считается мёртвой.
    # Под нагрузкой пара случайных обрывов так выключила обе реплики, и nginx
    # отдавал 502 "no live upstreams", хотя backend был жив. 3 ошибки за 5 с —
    # отличаем сбой от случайности, и выключенная реплика быстро возвращается.
    #
    # "backend" — имя сервиса из docker-compose.yml, Docker DNS отдаёт адреса
    # ВСЕХ реплик. resolve: nginx перечитывает эти адреса по ходу работы (через
    # resolver ниже), а не один раз при старте. Без него реплики, поднятые или
    # пересозданные после старта nginx (--scale, деплой), не получали трафик, а
    # на адреса удалённых nginx слал запросы в пустоту — лечилось только
    # перезапуском nginx. resolve требует zone (адреса хранятся в общей памяти).
    server backend:8000 resolve max_fails=3 fail_timeout=5s;

    # Постоянные соединения к backend. Без keepalive nginx открывает новое TCP-
    # соединение на КАЖДЫЙ запрос: лишние round-trip'ы и тысячи сокетов в
    # TIME_WAIT под нагрузкой. 32 — сколько простаивающих соединений держит
    # КАЖДЫЙ worker nginx (это не лимит активных соединений).
    keepalive 32;
    # Простаивающее соединение nginx закрывает сам через 60 с — раньше, чем
    # backend (gunicorn --keep-alive 75). Если бы первым закрывал backend, nginx
    # иногда отправлял бы запрос в уже закрывающееся соединение и отдавал 502.
    keepalive_timeout 60s;
}

# Docker DNS внутри сети. valid=5s — как часто перечитывать адреса реплик;
# ipv6=off — Docker-сеть у нас только IPv4, AAAA-запросы лишние.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

# Те же реплики, но ОТДЕЛЬНЫЙ upstream (и отдельные счётчики) для WebSocket.
# WebSocket — долгое соединение, и least_conn считает его активным всё время,
# пока открыта вкладка. В общем upstream одна открытая лента делала реплику
# "занятой", и ВСЕ короткие API-запросы уходили на соседнюю. Раздельно:
# API балансируется по API-соединениям, ленты — по лентам.
upstream backend_ws {
    least_conn;
    zone backend_ws_upstream 64k;
    server backend:8000 resolve max_fails=3 fail_timeout=5s;
}

# --- Формат лога с видимостью, какой backend ответил ---
# $upstream_addr показывает конкретный IP:порт backend-контейнера,
# обработавшего запрос — то же самое, что даёт /api/debug/instance-info,
# но видно сразу в логах nginx, без похода в приложение.
log_format upstream_log '$remote_addr - [$time_local] '
                         '"$request" $status '
                         'upstream=$upstream_addr '
                         'rt=$request_time uprt=$upstream_response_time';

# --- Rate limiting на уровне nginx (первый, грубый слой защиты) ---
# Отдельно от rate limiting в приложении через Redis (тот — точный,
# по бизнес-правилам, например "5 вычислений в минуту"). Этот —
# грубый и быстрый, отсекает совсем агрессивных клиентов ДО того,
# как запрос вообще дойдёт до Python и потратит ресурсы на поход в Redis.
# Классический паттерн defense in depth — два слоя разной строгости.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
# Отдельная, мягкая зона для дешёвых служебных эндпоинтов (/api/health,
# /api/debug/instance-info): строгие 20r/m для них отрезали бы уже 7-й запрос
# подряд — например, проверку распределения по репликам из README.
limit_req_zone $binary_remote_addr zone=api_light:10m rate=10r/s;
# По умолчанию limit_req отвечает 503 ("сервис недоступен"), что вводит в
# заблуждение: сервис жив, это клиент превысил лимит. 429 — честный код.
limit_req_status 429;

# --- HTTP -> HTTPS редирект ---
server {
    listen 80;
    server_name _;

    # Health check для Docker (healthcheck в compose бьёт по 127.0.0.1:80).
    # Стоит ДО редиректа, иначе проверка упрётся в 301 на HTTPS
    # с self-signed сертификатом.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- TLS ---
    # Self-signed сертификат для локальной разработки/демо.
    # TLS termination ИМЕННО ЗДЕСЬ означает: nginx расшифровывает
    # HTTPS-трафик, а дальше внутри Docker-сети до backend идёт
    # обычный HTTP — это НЕ end-to-end шифрование до самого backend,
    # а разграничение "снаружи всё зашифровано, внутри доверенной
    # приватной Docker-сети — нет". Для полного end-to-end пришлось бы
    # дополнительно шифровать и внутренний трафик nginx -> backend.
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log upstream_log;

    # --- Gzip для текстовых ответов ---
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 256;

    # --- Базовые security-заголовки ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------------------------------------
    # СТАТИКА — отдаётся НАПРЯМУЮ с диска, backend вообще не трогается.
    # Проверяется командой: docker compose stop backend && curl -Ik ...
    # должно продолжать отвечать 200.
    # ------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        # add_header внутри location ОТМЕНЯЕТ все add_header уровня server — без
        # повтора css/js отдавались бы без security-заголовков.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ------------------------------------------------------------
    # API — проксируется на backend, с rate limiting и таймаутами
    # ------------------------------------------------------------
    # Тяжёлый эндпоинт — строгая зона api_limit.
    location = /api/compute {
        limit_req zone=api_limit burst=5 nodelay;

        # API принимает только крошечный JSON ({"input": N}) — режем всё
        # остальное на входе, до backend.
        client_max_body_size 1k;

        proxy_pass http://backend;
        # keepalive к backend работает только по HTTP/1.1 и без "Connection: close",
        # который nginx по умолчанию добавляет к проксируемым запросам.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Real-IP ПЕРЕЗАПИСЫВАЕТСЯ адресом реального соединения: заголовок,
        # присланный клиентом, до backend не дойдёт. На это опирается backend,
        # считая лимиты по X-Real-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Вычисления могут идти дольше, чем дефолтный таймаут (60с) —
        # даём достаточный запас, но не бесконечность.
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # Остальной API — лёгкие запросы, мягкая зона.
    location /api/ {
        limit_req zone=api_light burst=20 nodelay;
        client_max_body_size 1k;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ------------------------------------------------------------
    # WEBSOCKET — отдельный location, обязательные заголовки
    # Upgrade/Connection. Без них proxy_pass отправит обычный HTTP-запрос,
    # соединение не "апгрейдится" до WebSocket, и клиент получит ошибку.
    # ------------------------------------------------------------
    location /ws {
        proxy_pass http://backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # WebSocket-соединение держится долго — обычный read_timeout
        # его оборвёт. Ставим большой таймаут именно для этого location.
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------
    # HEALTH CHECK для самого nginx (не для backend — у backend свой,
    # /api/health, который проксируется через location /api/ выше)
    # ------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        # default_type, а не add_header Content-Type: add_header ДОБАВИЛ бы второй
        # заголовок Content-Type к уже выставленному text/html.
        default_type text/plain;
        return 200 "ok\n";
    }
}
