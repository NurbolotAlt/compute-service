# ТОЛЬКО для нагрузочного теста — подключается через docker-compose.loadtest.yml.
#
# Со своей машины все запросы приходят в nginx с одного адреса, а лимиты у нас
# по IP: "100 разных клиентов" так не изобразить. Модуль realip подменяет
# $remote_addr значением из X-Forwarded-For, но ТОЛЬКО если запрос пришёл из
# Docker-сети (set_real_ip_from). Дальше всё как в проде: limit_req nginx и
# X-Real-IP для backend считают клиентом этот адрес.
#
# В проде это НЕЛЬЗЯ оставлять: любой клиент мог бы назваться любым IP и обойти
# все лимиты. Доверять X-Forwarded-For можно только от своего балансировщика/CDN.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
